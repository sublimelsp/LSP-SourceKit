# yaml-language-server: $schema=https://raw.githubusercontent.com/sublimelsp/lsp_smoke_test/v1/smoke.schema.json
# A Swift package, so that loading it with SwiftPM is tested too.
file: Sources/Smoke/main.swift
expected_diagnostics:
  message: Cannot find 'undeclaredName' in scope
# On Windows, sourcekit-lsp didn't always report the diagnostic within the default 180 seconds. 240 is the most the
# smoke test allows.
diagnostics_timeout: 240
# The server is disabled by default.
settings:
  LSP-SourceKit.sublime-settings:
    enabled: true
